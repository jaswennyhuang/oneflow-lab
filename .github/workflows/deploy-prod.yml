# A new platform tag (e.g. v1.1.0) deploys prod, after approval.
name: deploy-prod
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: deploy-prod
  cancel-in-progress: false   # never stop a deploy halfway
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod   # waits for a reviewer to approve
    steps:
      # Checks out the tagged commit
      - uses: actions/checkout@v4
      # Fake deploy: print each service and its version from environments/prod
      - name: Deploy prod
        run: |
          echo "### Prod now runs (platform $GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"
          for f in environments/prod/*.yaml; do
            echo "- $(basename "$f" .yaml): $(grep '^tag:' "$f" | cut -d'"' -f2)" >> "$GITHUB_STEP_SUMMARY"
          done
