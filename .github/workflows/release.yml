# Platform release PR: release-please on the release branch.
# Merging the release PR creates the platform tag (e.g. v1.1.0); deploy-prod.yml takes it from there.
name: release
on:
  push:
    branches: ['release/**']
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # target-branch: work on this release branch, not main
      # LAB_TOKEN: so the tag it creates can start deploy-prod.yml
      - uses: googleapis/release-please-action@v4
        with:
          target-branch: ${{ github.ref_name }}
          token: ${{ secrets.LAB_TOKEN }}
